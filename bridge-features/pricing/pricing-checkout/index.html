<title>Bridge.audio pricing</title>
<style>
:root {
  --bg:#f5f4f6;
  --card:#fff;
  --ink:#252428;
  --muted:#7b7882;
  --line:#dedce4;
  --radius:28px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
button, select { font:inherit }
main { max-width:1220px; margin:0 auto; padding:42px 24px 80px; }
.hero { text-align:center; margin:12px auto 44px; }
.hero h1 { margin:0; font-size:clamp(44px,7vw,82px); line-height:.92; letter-spacing:-.07em; font-weight:850; }
.hero p { margin:18px auto 0; max-width:640px; color:var(--muted); font-size:18px; line-height:1.35; }
.step { margin-bottom:18px; }
.step h2 { margin:0; font-size:34px; letter-spacing:-.055em; line-height:1; }
.step p { margin:8px 0 0; color:var(--muted); font-size:14px; }
.personas { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:790px; margin-bottom:30px; }
.persona { border:1px solid var(--line); background:#fff; border-radius:18px; padding:18px 20px; text-align:left; cursor:pointer; transition:.16s ease; }
.persona:hover { transform:translateY(-1px); border-color:var(--ink); }
.persona.active { border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
.persona strong { display:block; font-size:18px; letter-spacing:-.04em; line-height:1; }
.persona span { display:block; margin-top:8px; color:var(--muted); font-size:13px; line-height:1.25; }
.preselect { max-width:790px; min-height:230px; border:1px solid rgba(37,36,40,.08); border-radius:30px; background:linear-gradient(180deg,#fff,rgba(255,255,255,.5)); padding:34px; display:flex; flex-direction:column; justify-content:center; gap:10px; }
.preselect p { margin:0 0 6px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.15em; font-weight:800; }
.preselect strong { font-size:32px; line-height:1; letter-spacing:-.06em; }
.cards-title { margin:26px 0 18px; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
.cards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:28px; align-items:stretch; animation:rise .25s ease both; }
.plan { --accent:#252428; --accent-text:#fff; display:flex; flex-direction:column; min-height:780px; background:#fff; border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 1px 0 rgba(37,36,40,.04); }
.plan.recommended { border:2px solid var(--ink); box-shadow:8px 8px 0 var(--ink); transform:translateY(-3px); }
.plan-head { background:linear-gradient(180deg,color-mix(in srgb, var(--accent) 12%, white), white 78%); border-bottom:1px solid color-mix(in srgb, var(--accent) 18%, white); }
.badge { min-height:50px; display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 20px; background:var(--accent); color:var(--accent-text); font-size:13px; text-transform:uppercase; letter-spacing:.14em; font-weight:850; }
.diamond { width:18px; height:18px; display:inline-flex; }
.diamond svg { width:100%; height:100%; }
.plan-title { padding:19px 23px 18px; text-align:center; }
.plan-title h3 { margin:0; font-size:23px; letter-spacing:-.05em; line-height:1.05; }
.plan-title p { margin:11px 0 0; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; line-height:1.25; font-weight:800; }
.features { padding:14px 23px 16px; flex:1; }
.feature { display:grid; grid-template-columns:32px 1fr; gap:13px; padding:12px 0; border-bottom:1px solid rgba(37,36,40,.075); }
.feature:last-child { border-bottom:0; }
.icon { width:31px; height:31px; border-radius:11px; background:color-mix(in srgb, var(--accent) 13%, white); display:grid; place-items:center; }
.icon svg, .icon img { width:18px; height:18px; display:block; }
.feature h4 { margin:0 0 5px; font-size:14px; letter-spacing:-.025em; line-height:1.1; }
.feature ul { margin:0; padding:0; list-style:none; display:grid; gap:2px; }
.feature li { color:var(--muted); font-size:12px; line-height:1.32; }
.options { margin:8px 23px 12px; padding:14px; border:1px solid var(--line); border-radius:18px; background:#fafafa; }
.options h4 { margin:0 0 5px; font-size:15px; letter-spacing:-.035em; line-height:1; }
.options p { margin:0; color:var(--muted); font-size:12px; line-height:1.35; }
.option-toggle { width:100%; height:42px; margin-top:12px; border:1.5px solid var(--ink); border-radius:13px; background:#fff; color:var(--ink); font-weight:800; cursor:pointer; }
.field { margin-top:12px; display:grid; gap:7px; }
.field label { display:flex; gap:8px; align-items:center; font-size:12px; font-weight:800; }
.field label svg, .field label img { width:16px; height:16px; }
.select-wrap { position:relative; }
.select-wrap:after { content:"⌄"; position:absolute; right:13px; top:50%; transform:translateY(-55%); color:var(--muted); pointer-events:none; font-weight:800; }
select { appearance:none; width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; padding:11px 32px 11px 12px; font-size:13px; font-weight:650; color:var(--ink); cursor:pointer; }
.footer { margin-top:auto; padding:12px 23px 17px; border-top:1px solid rgba(37,36,40,.08); background:#fff; }
.footer-row { display:flex; align-items:flex-end; gap:12px; }
.footer-row.free { display:block; }
.price-col { flex:0 0 112px; }
.billing { display:inline-flex; gap:2px; padding:2px; margin-bottom:5px; border:1px solid var(--line); border-radius:999px; background:#fff; }
.billing button { border:0; background:transparent; color:var(--muted); border-radius:999px; padding:5px 6px; font-size:9px; font-weight:800; cursor:pointer; white-space:nowrap; }
.billing button.active { background:var(--accent); color:var(--accent-text); }
.price-main { display:flex; align-items:flex-end; gap:3px; }
.price { font-size:34px; line-height:.86; letter-spacing:-.06em; font-weight:850; }
.suffix { color:var(--muted); font-size:12px; font-weight:800; margin-bottom:4px; }
.year { margin-top:3px; color:var(--muted); font-size:10.5px; line-height:1.2; white-space:nowrap; font-weight:650; }
.cta-stack { flex:1; min-width:0; }
.cta { width:100%; min-height:50px; border:2px solid var(--ink); border-radius:14px; background:var(--accent); color:var(--accent-text); font-weight:850; font-size:15px; box-shadow:0 4px 0 var(--ink); cursor:pointer; }
.cta.secondary { background:#fff; color:var(--ink); }
.reassurance { margin-top:8px; text-align:center; color:var(--muted); font-size:11.5px; line-height:1.15; font-weight:650; }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@media (max-width:980px) {
  main { padding:26px 16px 56px; }
  .hero { text-align:left; margin-bottom:34px; }
  .hero h1 { font-size:46px; }
  .personas { grid-template-columns:1fr; max-width:none; }
  .cards { grid-template-columns:1fr; gap:18px; }
  .plan { min-height:0; }
  .plan.recommended { transform:none; box-shadow:5px 5px 0 var(--ink); }
  .preselect { max-width:none; min-height:190px; }
  .preselect strong { font-size:25px; }
  .footer-row { flex-direction:column; align-items:stretch; }
  .price-col { flex:0 0 auto; text-align:center; }
  .price-main { justify-content:center; }
}

body.modal-open{overflow:hidden}

.art-card-b{

const personas = [
  { id:"create", title:"I create music", copy:"Create, organize and grow your audience.", cards:["free","talent","music"], label:"Recommended for artists, composers, beatmakers, voice talent and musicians." },
  { id:"manage", title:"I manage music", copy:"Organize, pitch and promote your catalog.", cards:["free","music","enterprise"], label:"Recommended for labels, publishers, managers, PR teams, distributors and venues." },

const state = {
  persona: null,
  opts: {
    talent: { billing:"annual", visibility:0, users:0, open:false },
    music: { billing:"annual", visibility:0, users:0, open:false },
    supervisor: { billing:"annual", storage:0, users:0, open:false }
  }
};

function svg(name) {
  const src = iconData[name] || iconData.cloud;
  return `<img src="${src}" alt="">`;
}

function diamond() {
  return `<span class="diamond"><svg viewBox="0 0 21 20"><path d="M5.27 1.37 6.35 3.75l1.84.83h7.54c.23 0 .44.12.57.31l2.73 4.1c.17.25.15.59-.05.82l-8.2 9.57a.68.68 0 0 1-1.05-.01L1.98 9.8a.68.68 0 0 1-.07-.76l1.29-2.32L.95 5.69 0 5.26l.95-.43 2.38-1.08 1.08-2.38L4.84.42l.43.95Zm3.66 7.99-1.45.66 1.45.66.67 1.45.66-1.45 1.45-.66-1.45-.66-.66-1.45-.67 1.45Z" fill="currentColor"/></svg></span>`;
}

const eur = n => `${Math.round(n)}€`;
const opt = id => state.opts[id] || { billing:"annual", open:false };
function unit(plan,key) {
  const o = opt(plan.id), ops = plan.options || {};
  if (key === "visibility") return o.billing === "annual" ? ops.visibilityAnnual : ops.visibilityMonthly;
  if (key === "users") return o.billing === "annual" ? ops.userAnnual : ops.userMonthly;
  if (key === "storage") return o.billing === "annual" ? ops.storageAnnual : ops.storageMonthly;
  return 0;
}
function total(plan) {
  if (plan.type === "free") return 0;
  if (plan.type === "custom") return null;
  const o = opt(plan.id), ops = plan.options || {};
  let t = o.billing === "annual" ? plan.annual : plan.monthly;
  if (ops.visibilityUnit) t += (o.visibility / ops.visibilityUnit) * unit(plan,"visibility");
  if (ops.userAnnual) t += o.users * unit(plan,"users");
  if (ops.storageAnnual) t += o.storage * unit(plan,"storage");
  return Math.round(t);
}
function starting(plan) {
  if (plan.type === "custom") return "Custom";
  if (plan.type === "free") return "Free";
  return eur(plan.annual);
}

function renderPersonas() {
  document.getElementById("personas").innerHTML = personas.map(p => `
    <button class="persona ${state.persona === p.id ? "active" : ""}" data-persona="${p.id}">
      <strong>${p.title}</strong>
      <span>${p.copy}</span>
    </button>
  `).join("");
  document.querySelectorAll("[data-persona]").forEach(btn => {
    btn.onclick = () => {
      state.persona = btn.dataset.persona;
      render();
      setTimeout(() => {
        const carousel = document.getElementById("cardsCarousel");
        const recommended = carousel?.querySelector(".plan.recommended");
        if (window.matchMedia("(max-width: 980px)").matches && carousel && recommended) {
          carousel.scrollTo({ left: recommended.offsetLeft - (carousel.clientWidth - recommended.clientWidth) / 2, behavior: "smooth" });
          document.getElementById("cardsTitle")?.scrollIntoView({ behavior:"smooth", block:"start" });
        } else {
          document.getElementById("cardsTitle")?.scrollIntoView({ behavior:"smooth", block:"start" });
        }
      }, 160);
    };
  });
}

function renderFeature(f) {
  return `<div class="feature">
    <span class="icon">${svg(f[2])}</span>
    <div><h4>${f[0]}</h4><ul>${f[1].map(x => `<li>${x}</li>`).join("")}</ul></div>
  </div>`;
}

function optionSelect(plan, field, label, choices, unitSize, price, word) {
  const o = opt(plan.id);
  const value = o[field] || 0;
  return `<div class="field">
    <label>${field === "users" ? svg("team") : field === "storage" ? svg("cloud") : svg("eye")}${label}</label>
    <div class="select-wrap"><select data-plan="${plan.id}" data-field="${field}">
      ${choices.map(v => {
        const cost = unitSize ? (v / unitSize) * price : v * price;
        const label = v === 0 ? (field === "users" ? "No extra seats" : "Choose an option") : `+${v} ${word} — +${eur(cost)}/mo`;
        return `<option value="${v}" ${v === value ? "selected" : ""}>${label}</option>`;
      }).join("")}
    </select></div>
  </div>`;
}

function renderOptions(plan) {
  if (!plan.options) return "";
  const o = opt(plan.id), ops = plan.options;
  if (!o.open) return "";
  return `<div class="options">
    <h4>Checkout options</h4>
    <p>Add only what you need. You can change this later.</p>
    ${ops.visibilityLabel ? optionSelect(plan,"visibility",ops.visibilityLabel,ops.visibilityChoices,ops.visibilityUnit,unit(plan,"visibility"),"titles") : ""}
    ${ops.storageLabel ? optionSelect(plan,"storage",ops.storageLabel,ops.storageChoices,1,unit(plan,"storage"),"TB") : ""}
    ${optionSelect(plan,"users","Add seats",ops.userChoices,1,unit(plan,"users"),"seat")}
  </div>`;
}

function renderFooter(plan) {
  if (plan.type === "free") return `<div class="footer"><div class="footer-row free"><div class="cta-stack"><button class="cta">Start for free now</button><div class="reassurance">No credit card required</div></div></div></div>`;
  if (plan.type === "custom") return `<div class="footer"><div class="footer-row"><div class="price-col"><div class="price-main"><span class="price">Custom</span></div><div class="year">Talk to Sales</div></div><div class="cta-stack"><button class="cta secondary">Talk to Sales</button></div></div></div>`;
  const o = opt(plan.id);
  return `<div class="footer"><div class="footer-row">
    <div class="price-col">
      <div class="billing">
        <button class="${o.billing === "annual" ? "active" : ""}" data-billing="annual" data-plan="${plan.id}">Yearly -35%</button>
        <button class="${o.billing === "monthly" ? "active" : ""}" data-billing="monthly" data-plan="${plan.id}">Monthly</button>
      </div>
      <div class="price-main"><span class="price">${eur(total(plan))}</span><span class="suffix">/mo</span></div>
      <div class="year">${o.billing === "annual" ? eur(total(plan) * 12) + "/yr" : "Monthly billing"}</div>
    </div>
    <div class="cta-stack">
          <button class="cta" ${plan.options ? `data-modal="${plan.id}"` : ""}>Get started</button>
      <div class="reassurance">Cancel anytime</div>
    </div>
  </div></div>`;
}

function renderCard(plan, recommended) {
  return `<article class="plan ${recommended ? "recommended" : ""} ${plan.id === "free" ? "free-plan" : ""}" data-plan="${plan.id}" style="--accent:${plan.color};--accent-text:${plan.text}">
    <div class="plan-head card-top">
      <div class="badge">${plan.type === "fixed" ? diamond() : ""}${plan.badge}</div>
      <div class="plan-title"><h3>${plan.title}</h3></div>
    </div>
    <div class="card-scroll">
      <div class="features">${plan.features.map(renderFeature).join("")}</div>
    </div>
    ${renderFooter(plan)}
  </article>`;
}

function renderPlans() {
  const area = document.getElementById("plansArea");
  if (!state.persona) {
    area.innerHTML = `
      <div class="preselect">
        <div class="preselect-copy">
          <p>Organize. Discover. Pitch. Collaborate.<br><span class="bridge-sub">Powered by ethical AI.</span></p>
          <div class="preselect-benefits">
            <div class="preselect-benefit"><span>${svg("cloud")}</span><strong>Keep everything in one place.</strong></div>
            <div class="preselect-benefit"><span>${svg("share")}</span><strong>Share beautifully.</strong></div>
            <div class="preselect-benefit"><span>${svg("eye")}</span><strong>Grow your opportunities.</strong></div>
          </div>
        </div>
        <div class="preselect-art" aria-hidden="true">
          <div class="art-card art-card-a"></div>
          <div class="art-card art-card-b"></div>
          <div class="art-orbit"></div>
        </div>
      </div>`;
    document.getElementById("phaseText").textContent = "Where creators, music professionals and entertainment teams connect.";
    document.getElementById("stepText").textContent = "Choose how you work.";
    return;
  }
  const persona = personas.find(p => p.id === state.persona);
  const cards = persona.cards.map(id => plans[id]);
  area.innerHTML = `<div class="cards-title cards-audience" id="cardsTitle"><span>${persona.label}</span></div><div class="mobile-reco">Recommended plan</div><div class="cards" id="cardsCarousel">${cards.map((p,i) => renderCard(p, i === 1)).join("")}</div>`;
  document.getElementById("phaseText").textContent = "Choose the plan that fits the way you work.";
  document.getElementById("stepText").textContent = "Choose how you work.";
  document.querySelectorAll("[data-billing]").forEach(btn => btn.onclick = () => { opt(btn.dataset.plan).billing = btn.dataset.billing; render(); });
  document.querySelectorAll("[data-modal]").forEach(btn => btn.onclick = () => openModal(btn.dataset.modal));
}



let activeModalPlan = null;
let modalBoostOpen = false;

const includedByPlan = {
  talent: [
    "Unlimited tracks, videos & files",
    "250 GB workspace capacity",
    "Feature 10 titles on Bridge Talent",
    "5 seats included"
  ],
  music: [
    "Unlimited tracks, videos & files",
    "2 TB workspace capacity",
    "Promote 250 titles",
    "5 seats included"
  ],
  supervisor: [
    "Unlimited tracks, videos & files",
    "2 TB media workspace",
    "Full discovery access",
    "5 seats included"
  ]
};

function modalOptionSelect(plan, field, label, choices, unitSize, price, word) {
  const o = opt(plan.id);
  const value = o[field] || 0;
  return `<div class="modal-field">
    <label>${field === "users" ? svg("team") : field === "storage" ? svg("cloud") : svg("eye")}${label}</label>
    <div class="modal-choices">
      ${choices.map(v => {
        const cost = v === 0 ? 0 : (unitSize ? (v / unitSize) * price : v * price);
        const isActive = v === value ? "active" : "";
        const title = v === 0 ? "Included" : field === "users" ? `+${v} seat${v > 1 ? "s" : ""}` : field === "storage" ? `+${v} TB` : `+${v} titles`;
        const sub = v === 0 ? "No boost for now" : `+${eur(cost)}/mo`;
        return `<button class="${isActive}" data-modal-plan="${plan.id}" data-modal-field="${field}" data-modal-value="${v}">
          <strong>${title}</strong><span>${sub}</span>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

function renderBoostOptions(plan) {
  const ops = plan.options || {};
  const visibility = ops.visibilityLabel ? modalOptionSelect(plan, "visibility", "Grow your audience", ops.visibilityChoices, ops.visibilityUnit, unit(plan, "visibility"), "titles") : "";
  const storage = ops.storageLabel ? modalOptionSelect(plan, "storage", "Grow your workspace", ops.storageChoices, 1, unit(plan, "storage"), "TB") : "";
  const users = modalOptionSelect(plan, "users", "Grow your team", ops.userChoices, 1, unit(plan, "users"), "seat");
  return `<div class="modal-options">${visibility}${storage}${users}</div>`;
}

function renderCheckoutModal(planId) {
  const plan = plans[planId];
  if (!plan || !plan.options) return;
  const o = opt(plan.id);
  const price = eur(total(plan));
  const yearly = o.billing === "annual" ? `${eur(total(plan) * 12)}/yr` : "Monthly billing";
  const included = (includedByPlan[plan.id] || []).map(x => `<li>${x}</li>`).join("");

  document.getElementById("checkoutContent").innerHTML = `
    <div class="modal-plan-head compact" style="--accent:${plan.color};--accent-text:${plan.text}">
      <div class="modal-badge">${diamond()}${plan.badge}</div>
      <h3 id="checkoutTitle">Start with ${plan.badge.replace(" / MEDIA", "")}</h3>
      <p>Everything below is included in your base plan.</p>
    </div>

    <div class="modal-included">
      <h4>Your plan includes</h4>
      <ul>${included}</ul>
    </div>

    <div class="modal-billing" style="--accent:${plan.color};--accent-text:${plan.text}">
      <button class="${o.billing === "annual" ? "active" : ""}" data-modal-billing="annual" data-modal-plan="${plan.id}">Yearly -35%</button>
      <button class="${o.billing === "monthly" ? "active" : ""}" data-modal-billing="monthly" data-modal-plan="${plan.id}">Monthly</button>
    </div>

    <div class="modal-boost">
      <button class="modal-boost-toggle" data-boost-toggle>
        <span>Need more?</span>
        <strong>${modalBoostOpen ? "Hide boosts" : "Boost your plan"}</strong>
      </button>
      ${modalBoostOpen ? renderBoostOptions(plan) : `<p class="boost-help">You can add more visibility, seats or storage now, or do it later from your workspace.</p>`}
    </div>

    <div class="modal-total">
      <div>
        <span>Total</span>
        <strong>${price}<small>/mo</small></strong>
        <em>${yearly}</em>
      </div>
      <div class="modal-actions">
        <button class="cta modal-cta" data-close-modal style="--accent:${plan.color};--accent-text:${plan.text}">Get started</button>
        <button class="later-link" data-close-modal>I'll boost my plan later</button>
      </div>
    </div>
  `;

  const boost = document.querySelector("[data-boost-toggle]");
  if (boost) boost.onclick = () => {
    modalBoostOpen = !modalBoostOpen;
    renderCheckoutModal(plan.id);
  };

  document.querySelectorAll("[data-modal-field]").forEach(btn => btn.onclick = () => {
    opt(btn.dataset.modalPlan)[btn.dataset.modalField] = Number(btn.dataset.modalValue);
    render();
    renderCheckoutModal(btn.dataset.modalPlan);
  });
  document.querySelectorAll("[data-modal-billing]").forEach(btn => btn.onclick = () => {
    opt(btn.dataset.modalPlan).billing = btn.dataset.modalBilling;
    render();
    renderCheckoutModal(btn.dataset.modalPlan);
  });
  document.querySelectorAll("[data-close-modal]").forEach(btn => btn.onclick = closeModal);
}

function openModal(planId) {
  activeModalPlan = planId;
  modalBoostOpen = false;
  renderCheckoutModal(planId);
  document.getElementById("checkoutModal").classList.add("visible");
  document.getElementById("checkoutModal").setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
}

function closeModal() {
  document.getElementById("checkoutModal").classList.remove("visible");
  document.getElementById("checkoutModal").setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  activeModalPlan = null;
  modalBoostOpen = false;
}

function render() {
  renderPersonas();
  renderPlans();
}
render();
</script>
</body>
</html>
