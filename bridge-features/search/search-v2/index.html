      border: 0 !important; border-radius: 8px !important; background: transparent !important;

    .suggestions-dismissed .quick-start { display: none !important; }

    /* V24 filter interaction states */
    .tag-family-items button.selected { cursor: pointer !important; }

      width: auto !important;
      min-width: 42px;
      height: 22px;
      padding: 0 8px;

      font-weight: 800;

      .show-suggestions { padding-inline: 5px; font-size: 9px; }
    }
  

</style>




<style id="bridge-clean-ui">
/* =========================================================
   CLEAN CONSOLIDATED UI LAYER
   The React search engine remains untouched.
   ========================================================= */

.criteria-summary-trigger,
.criteria-summary-panel,
.view-switch,
.review-experience,
.review-stage,
.review-card,
.review-complete,
.review-actions,
.review-footer,
.show-more,
.sort-button,

}
.results-head p { display:none !important; }

.suggestions,
.filter-panel {
  width:100%;
  max-width:100%;
  transform-origin:top center;
  animation:bridgeDropdownIn 120ms ease-out;
}
@keyframes bridgeDropdownIn {
  from { opacity:0; transform:translateY(-3px); }
  to { opacity:1; transform:translateY(0); }
}
.search-area.bridge-dismissed > .suggestions { display:none !important; }

/* ----- Native precise filters ----- */
.tag-family-items > button:focus-visible {

  border-color:#aeb7ff;
  background:#f7f8ff;

}

  font-weight:850;
}
.tag-family-items > button.bridge-feedback .tag-add {
  animation:bridgeTagFeedback 180ms ease-out;
}
@keyframes bridgeTagFeedback {
  0% { transform:scale(.92); opacity:.72; }
  55% { transform:scale(1.08); opacity:1; }
  100% { transform:scale(1); opacity:1; }
}

/* ----- Shared suggestion row primitives ----- */

/* ----- External metadata scope criterion ----- */

@media(max-width:760px){
  .bridge-ranked-row{
    min-height:47px;
    padding:7px 8px;
    gap:8px;
  }
  .bridge-ranked-row .bridge-meta-type{
    min-width:54px;
    max-width:76px;
    height:20px;
    padding:0 5px;
    font-size:8px;
  }
  .bridge-ranked-section .bridge-ranked-row:nth-child(n+8){
    display:none!important;
  }
}


/* V67 — Enter accepts best suggestion; Global stays last */
.bridge-ranked-row.bridge-default-choice:not(.bridge-active){
  background:rgba(52,70,228,.035);
}
.bridge-ranked-row.bridge-default-choice:not(.bridge-active)::after{
  content:"Enter";
  flex:0 0 auto;
  margin-left:auto;
  padding:2px 6px;
  border-radius:999px;
  background:#f1f2f4;
  color:#777481;
  font-size:8px;
  font-weight:800;
}
.bridge-ranked-row:has(.bridge-meta-type:first-child){
  position:relative;
}
.bridge-ranked-row:last-child .bridge-meta-type{
  background:#f3f3f5;
  color:#5e5b66;
}


/* =========================================================
   V68 — Product feedback consolidation
   ========================================================= */

/* Search composer — one line by default, max two lines when needed.
   All validated methods stay inside the composer. */
.search-box{
  width:100%!important;
  min-height:52px!important;
  height:auto!important;
  max-height:84px!important;
  display:flex!important;
  align-items:center!important;
  flex-wrap:nowrap!important;
  gap:7px!important;
  padding:6px 7px!important;
  overflow:visible!important;
}
.search-box>svg{
  flex:0 0 22px!important;
  width:22px!important;
  height:22px!important;
  align-self:center!important;
  margin:0!important;
}
.search-box>.input-flow{
  flex:1 1 auto!important;
  min-width:0!important;
  width:auto!important;
  min-height:32px!important;
  max-height:68px!important;
  display:flex!important;
  align-items:center!important;
  align-content:flex-start!important;
  flex-wrap:wrap!important;
  gap:4px!important;
  padding:0!important;
  margin:0!important;
  overflow-x:hidden!important;
  overflow-y:visible!important;
  scrollbar-width:none!important;
  scroll-behavior:auto!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior:contain!important;
  touch-action:pan-y!important;
}
.search-box>.input-flow::-webkit-scrollbar{display:none!important}
.search-box.bridge-composer-overflow>.input-flow{
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior:contain!important;
  scroll-behavior:smooth!important;
  scrollbar-gutter:stable both-edges;
}

/* Every validated search method stays visible inside the search component. */
.search-box .criterion,
.search-box .criterion.mobile-collapsed{
  display:inline-flex!important;
  flex:0 0 auto!important;
  min-height:32px!important;
  height:32px!important;
  max-width:190px!important;
  margin:0!important;
  align-items:center!important;
}
.search-box .source-criterion{
  max-width:260px!important;
}
.search-box .smart-criterion{
  max-width:210px!important;
}
.search-box .criteria-toggle{
  display:none!important;
}
.search-box .criterion-main{
  min-height:32px!important;
  height:32px!important;
  padding-top:0!important;
  padding-bottom:0!important;
  display:flex!important;
  align-items:center!important;
}
.search-box .criterion-main>span:nth-child(2),
.search-box .smart-criterion>strong,
.search-box .source-copy>strong{
  min-width:0!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
}
.search-box .criterion-main>span:nth-child(2){max-width:105px!important}
.search-box .source-copy{
  min-width:0!important;
  max-width:160px!important;
}
.search-box .source-copy>small{
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
}
.search-box .youtube-chip-thumb{
  width:26px!important;
  min-width:26px!important;
  height:26px!important;
}
.search-box .youtube-chip-thumb img{
  width:26px!important;
  height:26px!important;
  object-fit:cover!important;
}

.search-box .input-flow input{
  flex:1 1 145px!important;
  min-width:105px!important;
  width:auto!important;
  height:32px!important;
  min-height:32px!important;
  padding-top:0!important;
  padding-bottom:0!important;
  margin:0!important;
  line-height:32px!important;
  align-self:center!important;
}

.search-box>.voice-button,
.search-box>.filter-button,
.search-box>.search-button{
  flex:0 0 auto!important;
  align-self:center!important;
  margin:0!important;
}
.search-box>.voice-button{
  width:38px!important;
  min-width:38px!important;
  height:38px!important;
}
.search-box>.filter-button{
  min-width:38px!important;
  height:38px!important;
}
.search-box>.search-button{
  width:40px!important;
  min-width:40px!important;
  height:40px!important;
}
.keyboard-hint{display:none!important}

/* Ranked dropdown: no visible distinction between Smart and Metadata sections. */
.bridge-ranked-row .bridge-meta-type{
  text-transform:capitalize;
}
.bridge-ranked-row:has(.bridge-meta-type){
  border:0!important;
}
.bridge-ranked-row:last-child{
  margin-top:5px;
  border-top:1px solid #ececef!important;
  border-radius:0 0 9px 9px;
  padding-top:10px;
}
.bridge-ranked-row:last-child .bridge-meta-type{
  background:#f3f3f5!important;
  color:#5e5b66!important;
}
/* Similarity is unmistakable when a YouTube reference is present. */
.bridge-ranked-youtube{
  min-height:56px!important;
  background:#f8f8ff!important;
  border:1px solid #e0e2ff!important;
}
.bridge-ranked-youtube .bridge-meta-copy small{color:#626fae}

/* Only a compact explanation of tags is shown per result. */
.bridge-match-tags{
  min-width:0;
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:1px;
  overflow:hidden;
}
.bridge-match-tags i,
.bridge-match-tags b{
  flex:0 0 auto;
  max-width:92px;
  height:14px;
  padding:0 4px;
  border-radius:4px;
  background:#f1f1f4;
  color:#74717b;
  display:inline-flex;
  align-items:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:7.5px;
  line-height:14px;
  font-style:normal;
  font-weight:700;
}
.bridge-match-tags b{background:#e9eaf0;color:#5e5b66}
.track-result,
.track-result > .track,
.bridge-duration,.bridge-added,.bridge-hubs,.bridge-actions{
  min-height:58px!important;
  height:58px!important;
}

/* Keep the previous compact interpretation treatment. */
.interpretation{display:none!important}

@media(max-width:760px){
  .search-box{
    min-height:52px!important;
    height:auto!important;
    max-height:82px!important;
    gap:4px!important;
    padding:6px!important;
  }
  .search-box>svg{
    flex-basis:20px!important;
    width:20px!important;
    height:20px!important;
  }
  .search-box>.input-flow{
    min-height:32px!important;
    max-height:66px!important;
    gap:4px!important;
  }
  .search-box .criterion,
  .search-box .criterion.mobile-collapsed{
    min-height:31px!important;
    height:31px!important;
    max-width:145px!important;
  }
  .search-box .source-criterion{max-width:195px!important}
  .search-box .smart-criterion{max-width:160px!important}
  .search-box .criterion-main{
    min-height:31px!important;
    height:31px!important;
  }
  .search-box .criterion-main>span:nth-child(2){max-width:82px!important}
  .search-box .source-copy{max-width:105px!important}
  .search-box .youtube-chip-thumb,
  .search-box .youtube-chip-thumb img{
    width:25px!important;
    min-width:25px!important;
    height:25px!important;
  }
  .search-box .input-flow input{
    flex:1 1 86px!important;
    min-width:68px!important;
    height:31px!important;
    min-height:31px!important;
    line-height:31px!important;
    font-size:16px!important;
  }
  .search-box>.voice-button,
  .search-box>.filter-button{
    width:36px!important;
    min-width:36px!important;
    height:36px!important;
    padding:0!important;
  }
  .search-box>.filter-button span{display:none!important}
  .search-box>.search-button{
    width:38px!important;
    min-width:38px!important;
    height:38px!important;
    padding:0!important;
  }

  .bridge-match-tags i:nth-of-type(n+3){display:none}
  .track-result,
  .track-result > .track,
  .bridge-actions{
    height:62px!important;
    min-height:62px!important;
  }
}


/* =========================================================
   VOICE SESSION — single authoritative recording state
   The session survives React re-renders of the composer.
   ========================================================= */
.search-box.bridge-recording{
  position:relative!important;
  min-height:52px!important;
  height:52px!important;
  max-height:52px!important;
  flex-wrap:nowrap!important;
  align-items:center!important;
  overflow:visible!important;
}
.search-box.bridge-recording>.input-flow{
  position:relative!important;
  flex:1 1 auto!important;
  min-width:0!important;
  width:auto!important;
  height:38px!important;
  min-height:38px!important;
  max-height:38px!important;
  flex-wrap:nowrap!important;
  overflow:hidden!important;
  padding:0!important;
}
.search-box.bridge-recording .input-flow input{
  opacity:0!important;
  pointer-events:none!important;
  caret-color:transparent!important;
}
.search-box.bridge-recording>.voice-button,
.search-box.bridge-recording>.filter-button,
.search-box.bridge-recording>.search-button,
.search-box.bridge-recording>[data-bridge-voice-hidden="true"]{
  display:none!important;
  visibility:hidden!important;
  pointer-events:none!important;
}
.bridge-live-transcript{
  position:absolute!important;
  inset:0!important;
  min-width:0!important;
  display:flex!important;
  align-items:center!important;
  overflow:hidden!important;
  white-space:nowrap!important;
  text-overflow:ellipsis!important;
  color:var(--primaryDarkContent,#252428)!important;
  pointer-events:none!important;
}
.bridge-live-transcript.placeholder{color:#9b98a1!important}
.bridge-record-controls{
  position:static!important;
  inset:auto!important;
  transform:none!important;
  flex:0 0 auto!important;
  margin:0 0 0 auto!important;
  display:flex!important;
  align-items:center!important;
  gap:6px!important;
  z-index:60!important;
}
.bridge-record-controls button{
  position:static!important;
  width:38px!important;
  min-width:38px!important;
  height:38px!important;
  padding:0!important;
  margin:0!important;
  border-radius:9px!important;
  display:grid!important;
  place-items:center!important;
  cursor:pointer!important;
}
.bridge-record-cancel{
  border:1px solid #e1e0e4!important;
  background:#fff!important;
  color:#64616a!important;
}
.bridge-record-confirm{
  border:0!important;
  background:#252428!important;
  color:#fff!important;
}
.search-area:has(.search-box.bridge-recording)>.suggestions,
.search-area:has(.search-box.bridge-recording)>.filter-panel{
  display:none!important;
}
@media(max-width:760px){
  .search-box.bridge-recording>.input-flow{
    height:36px!important;
    min-height:36px!important;
    max-height:36px!important;
  }
  .bridge-record-controls{gap:4px!important}
  .bridge-record-controls button{
    width:36px!important;
    min-width:36px!important;
    height:36px!important;
  }
}

/* V72 Global Live is an explicit preview state */
.bridge-live-results-shell.bridge-global-preview{
  border:1px solid #e4e5ee;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}
.bridge-global-live-banner{
  min-height:34px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:7px;
  border-bottom:1px solid #ececf0;
  background:#f7f8ff;
}
.bridge-global-live-banner strong{font-size:11px;color:#3446e4}
.bridge-global-live-banner span{font-size:10px;color:#777481}
.bridge-global-live-banner .bridge-live-dot{
  width:6px;height:6px;border-radius:50%;background:#3446e4;flex:0 0 6px;
}

/* V72 Year / Period suggestions use the normal ranked-list language */
.bridge-ranked-row.bridge-date-row .bridge-meta-type{
  background:#f5f0ff;color:#7052a8;
}

/* V76 — combined explicit interpretation */
.bridge-meta-type-combined{
  background:#17171a!important;
  color:#fff!important;
}
.bridge-ranked-row:has(.bridge-meta-type-combined){
  background:#fafafa!important;
}
.bridge-ranked-row:has(.bridge-meta-type-combined) .bridge-meta-copy strong{
  font-weight:800!important;
}


/* =========================================================
   V82 — ONE RESULT RENDERER
   Native React result groups are hidden data sources only.
   ========================================================= */
.page.bridge-results-controlled .results:not(.bridge-live-results-shell){
  display:none!important;
}

.bridge-controlled-results-shell{
  width:100%;
  margin-top:14px;
  padding:0;
  border:0;
  background:transparent;
}

.bridge-controlled-results-shell.bridge-global-preview{
  margin-top:12px;
}

.bridge-controlled-results-shell .bridge-list-head{
  margin:0!important;
}

.bridge-controlled-results-shell .track-result{
  margin:0!important;
}

.bridge-alternative-separator{
  min-height:31px;
  margin:0;
  padding:7px 10px;
  border-top:1px solid #e6e6ea;
  border-bottom:1px solid #eeeeF1;
  background:#fafafa;
  display:flex;
  align-items:center;
  gap:7px;
  color:#777481;
}

.bridge-alternative-separator strong{
  font-size:9px;
  line-height:16px;
  font-weight:800;
  color:#5f5c65;
}

.bridge-alternative-separator span{
  font-size:8px;
  line-height:16px;
  color:#96939c;
}

.bridge-alternative-separator span::before{
  content:"·";
  margin-right:7px;
  color:#b0adb5;
}

.page.bridge-live-filtering .quick-start{
  display:none!important;
}

@media(max-width:760px){
  .bridge-controlled-results-shell{
    margin-top:10px;
  }
  .bridge-alternative-separator{

}

  --ink: #252428;
  --muted: #777481;
  --line: #e7e7e9;
  --blue: #3446e4;
  --purple: #6c32e8;
  --danger: #bd2435;
  --surface: #f7f7f9;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: Manrope, "Avenir Next", Avenir, Arial, sans-serif;
}
button,
input {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
.page {
  width: 100%;
  margin: 0 auto;
  padding: 32px 14px 84px;
}
.heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.eyebrow {
  color: var(--blue);
  font-size: 9px;
  font-weight: 820;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.heading h1 {
  margin: 9px 0 6px;
  font-size: 28px;
  line-height: 1.08;
  letter-spacing: -0.045em;
  font-weight: 680;
}
.heading p {
  max-width: 310px;
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.clear-wrap {
  position: relative;
  flex: 0 0 auto;
}
.clear-all {
  padding: 7px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.clear-confirm {
  position: absolute;
  right: 0;
  top: 0;
  z-index: 12;
  width: 225px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 12px 30px rgba(37, 36, 40, 0.12);
  font-size: 9px;
  white-space: nowrap;
}
.clear-confirm button {
  padding: 5px 7px;
  border: 0;
  border-radius: 6px;
  background: #f1f1f3;
  color: #55515c;
  cursor: pointer;
}
.clear-confirm button:last-child {
  background: #fff0f1;
  color: var(--danger);
}
.search-area {
  position: relative;
  z-index: 10;
  margin-top: 23px;
}
.search-box {
  width: 100%;
  min-height: 62px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 40px 40px 42px;
  align-items: end;
  gap: 7px;
  padding: 10px;
  border: 1.5px solid #c9c8cd;
  border-radius: 15px;
  background: #fff;
  cursor: text;
  transition:
    0.18s border-color,
    0.18s box-shadow;
}
.search-box.focused {
  border-color: var(--blue);
  box-shadow:
    0 0 0 4px rgba(52, 70, 228, 0.08),
    0 12px 34px rgba(37, 36, 40, 0.06);
}
.search-box.listening {
  border-color: #6657db;
  box-shadow:
    0 0 0 4px rgba(102, 87, 219, 0.09),
    0 12px 34px rgba(37, 36, 40, 0.06);
}
.search-box > svg {
  display: none;
}
.input-flow {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}
.input-flow input {
  height: 38px;
  flex: 1;
  min-width: 145px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}
.input-flow input::placeholder {
  color: #9a98a1;
}
.input-flow input:disabled {
  cursor: wait;
}
.voice-button {
  position: relative;
  grid-column: 2;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid #e1e0e4;
  border-radius: 10px;
  background: #fff;
  color: #64616a;
  cursor: pointer;
  transition:
    0.18s background,
    0.18s color;
}
.voice-button:hover {
  background: #f1f1f4;
  color: var(--ink);
}
.voice-button.listening {
  color: #5d45d3;
  background: #eeeaff;
}
.voice-button.error {
  color: #a92735;
  background: #fff0f1;
  border-color: #f3cfd3;
}
.voice-pulse {
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(93, 69, 211, 0.4);
  border-radius: 7px;
  animation: voice-ring 1.25s ease-out infinite;
}
@keyframes voice-ring {
  70% {
    transform: scale(1.2);
    opacity: 0;
  }
}
.voice-message {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
  padding: 0 3px;
  color: #706d77;
  font-size: 8px;
}
.voice-message > span {
  width: 6px;
  height: 6px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #7c69e5;
}
.voice-message.listening > span {
  animation: pulse 1.1s infinite;
}
.voice-message.error {
  color: #9d2733;
}
.voice-message.error > span {
  background: #c33a48;
}
.voice-message button {
  display: grid;
  place-items: center;
  margin-left: auto;
  padding: 3px;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.filter-button {
  grid-column: 3;
}
.search-button {
  grid-column: 4;
}
.voice-button,
.filter-button,
.search-button {
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
}
.filter-button {
  width: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #e1e0e4;
  background: #fff;
  color: #64616a;
}
.filter-button span {
  display: none;
}
.filter-button.active {
  color: var(--ink);
  background: #f3f3f5;
}
.search-button {
  width: 42px;
  display: grid;
  place-items: center;
  border: 0;
  background: var(--ink);
  color: #fff;
}
.search-button:disabled {
  opacity: 0.18;
  cursor: default;
}
.spinner {
  width: 17px;
  height: 17px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.criterion {
  position: relative;
  min-height: 34px;
  display: inline-flex;
  align-items: stretch;
  border: 1px solid transparent;
  border-radius: 9px;
  white-space: nowrap;
}
.criterion button {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.criterion-main {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 3px 5px 7px;
}
.criterion-main > span:nth-child(2) {
  max-width: 125px;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 760;
}
.criterion-main small {
  padding: 3px 5px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.75);
  font-size: 7px;
  font-weight: 850;
  text-transform: uppercase;
}
.criterion-main small.confidence {
  color: #8a6418;
  background: #fff3ca;
}
.criterion-remove {
  display: grid;
  place-items: center;
  padding: 0 7px 0 3px !important;
  opacity: 0.55;
}
.criterion-remove:hover {
  opacity: 1;
}
.chevron {
  font-size: 11px;
}
.role-symbol {
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 900;
}
.role-symbol.must {
  color: #18744c;
  background: #dff4e9;
}
.role-symbol.should {
  color: #2e53d2;
  background: #e4eaff;
}
.role-symbol.exclude {
  color: #b31222;
  background: #ffe1e4;
}
.tag-criterion.weight-must {
  color: #2439be;
  background: #eef0ff;
  border-color: #dce0ff;
}
.tag-criterion.weight-should {
  color: #615e68;
  background: #f7f7f9;
  border-color: #c9c8ce;
  border-style: dashed;
}
.tag-criterion.weight-exclude {
  color: #b31222;
  background: #fff0f1;
  border-color: #ffd9dd;
}
.tag-criterion.uncertain {
  border-color: #d79d28;
  background: #fffaf0;

  const normalize = s => String(s || '').trim().toLowerCase();
  const normalizeISRC = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g,'');

  const normalizeWords = s => String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[’']/g,' ')
    .replace(/[^a-z0-9♭♯#]+/g,' ')
    .trim().replace(/\s+/g,' ');

  const NEGATION_RE = /(?:^|\s)(?:without|no|avoid|exclude|excluding|except|sans|pas de|pas d|eviter|éviter)\s+(?:[a-z0-9]+\s+){0,2}$/i;
  const NICE_RE = /(?:^|\s)(?:nice to have|ideally|preferably|if possible|bonus|si possible|de preference|de préférence)\s+(?:[a-z0-9]+\s+){0,2}$/i;

  const TAG_ALIASES = (() => {
    const rows=[];
    for(const tag of BRIDGE_TAG_DICTIONARY){
      for(const aliasRaw of (tag.aliases||[])){
        const alias=normalizeWords(aliasRaw);
        if(!alias || alias.length<2) continue;
        rows.push({tag,alias,tokens:alias.split(' ').length,length:alias.length,canonicalExact:normalizeWords(tag.name)===alias});
      }
    }
    rows.sort((a,b)=>b.tokens-a.tokens || Number(b.canonicalExact)-Number(a.canonicalExact) || b.length-a.length);
    return rows;
  })();

  function detectKnownTags(raw){
    const source=normalizeWords(raw);
    if(!source) return [];

    const occupied=[];
    const found=[];
    const seen=new Set();

    const overlaps=(start,end)=>occupied.some(span=>start<span.end && end>span.start);

    for(const row of TAG_ALIASES){
      const escaped=row.alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
      const re=new RegExp(`(^|\\s)(${escaped})(?=\\s|$)`,'g');
      let match;
      while((match=re.exec(source))){
        const start=match.index + match[1].length;
        const end=start + match[2].length;
        if(overlaps(start,end)) continue;

        const key=row.tag.name;
        if(seen.has(key)) continue;

        const before=source.slice(Math.max(0,start-48),start);
        const weight=NEGATION_RE.test(before) ? 'exclude' : NICE_RE.test(before) ? 'should' : 'must';

        occupied.push({start,end});
        seen.add(key);
        found.push({
          name:row.tag.name,
          id:row.tag.id,
          family:row.tag.family,
          category:row.tag.category,
          synthetic:!!row.tag.synthetic,
          alias:match[2],
          weight,
          start,
          end
        });
      }
    }

    return found.sort((a,b)=>a.start-b.start);
  }

  function tagBundleCandidate(raw){
    const matches=detectKnownTags(raw);
    if(!matches.length) return null;

    const must=matches.filter(x=>x.weight==='must').length;
    const should=matches.filter(x=>x.weight==='should').length;
    const exclude=matches.filter(x=>x.weight==='exclude').length;
    const pieces=matches.map(x=>`${x.weight==='exclude'?'− ':x.weight==='should'?'+ ':''}${x.name}`);

    return {
      kind:'tagbundle',
      label:pieces.join(' · '),
      detail:[
        `${matches.length} known Bridge ${matches.length===1?'tag':'tags'}`,
        must?`${must} Must`:null,
        should?`${should} Nice`:null,
        exclude?`${exclude} Exclude`:null
      ].filter(Boolean).join(' · '),
      typeLabel:matches.length===1?'Tag':'Tags',
      score:1200 + matches.length*70,
      matches
    };
  }

  function metadataFields(track) {
    return {
      track: track.title || '',
      artist: track.artist || '',
      album: track.album || '',
      label: track.label || '',
      isrc: track.isrc || '',
      catalog: track.catalog || '',
      composer: track.composer || '',
      publisher: track.publisher || '',
      year: String(track.year || ''),
    };
  }

  function parseMetadataQuery(raw) {
    raw = String(raw || '').trim();
    const explicit = raw.match(/^(artist|track|title|album|label|isrc|catalog(?:ue)?|composer|writer|publisher)\s*[:=]\s*(.+)$/i);
    if (explicit) {
      return {
        type: explicit[1].toLowerCase().replace('title','track').replace('catalogue','catalog').replace('writer','composer'),
        value: explicit[2].trim(),
      };
    }
    if (/^[A-Z]{2}[-\s]?[A-Z0-9]{3}[-\s]?\d{2}[-\s]?\d{5}$/i.test(raw) || /^[A-Z]{2}[A-Z0-9]{3}\d{7}$/i.test(raw)) {
      return { type:'isrc', value:raw };
    }
    return { type:null, value:raw };
  }

  function fieldMatchScore(type, candidateRaw, queryRaw) {
    if (!candidateRaw || !queryRaw) return 0;
    const candidate = type === 'isrc' ? normalizeISRC(candidateRaw) : normalize(candidateRaw);
    const query = type === 'isrc' ? normalizeISRC(queryRaw) : normalize(queryRaw);
    if (!candidate || !query) return 0;
    if (candidate === query) return 300;
    if (candidate.startsWith(query)) return 190;
    if (candidate.includes(query)) return 110;
    return 0;
  }

  function rankMetadata(raw, forcedType=null) {
    const parsed = parseMetadataQuery(raw);
    const type = forcedType || parsed.type;
    const value = parsed.value;
    if (!value) return [];
    return DEMO.map((track, index) => {
      let best = 0, matchedType = null, matchedValue = null;
      for (const [field, candidate] of Object.entries(metadataFields(track))) {
        if (type && field !== type) continue;
        const score = fieldMatchScore(field, candidate, value);
        if (score > best) {
          best = score;
          matchedType = field;
          matchedValue = candidate;
        }
      }
      return {...track, score:best, matchedType, matchedValue, index};
    }).filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score || a.index - b.index);
  }

  function metadataSuggestions(raw) {
    const parsed = parseMetadataQuery(raw);
    if (!parsed.value || parsed.value.length < 2) return [];
    const out = [];
    for (const track of DEMO) {
      for (const [field, candidate] of Object.entries(metadataFields(track))) {
        if (parsed.type && field !== parsed.type) continue;
        const score = fieldMatchScore(field, candidate, parsed.value);
        if (score) out.push({type:field, value:candidate, score, track});
      }
    }
    const seen = new Set();
    return out.sort((a,b) => b.score - a.score || a.value.localeCompare(b.value))
      .filter(item => {
        const key = `${item.type}|${normalize(item.value)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .slice(0,5);
  }

  function clearScopeChip() {
    q('.bridge-scope-chip')?.remove();
  }

  function setReactInputValue(input, value) {
    if (!input) return;
    const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;
    setter ? setter.call(input, value) : (input.value = value);
    input.dispatchEvent(new Event('input',{bubbles:true}));
  }

  function renderScopeChip() {
    if (!state.scope) {
      clearScopeChip();
      return;
    }

    const input=mainInput();
    const flow=input?.closest('.input-flow');
    if(!input||!flow) return;

    const signature=`${state.scope.type}|${state.scope.value}`;
    const existing=q('.bridge-scope-chip',flow);
    if(existing?.dataset.bridgeScopeSignature===signature) return;
    existing?.remove();

    const chip=document.createElement('span');
    chip.className='bridge-scope-chip';
    chip.dataset.bridgeScopeSignature=signature;
    chip.innerHTML=`
      <span class="bridge-scope-pill">${state.scope.type==='global'?'Global':state.scope.type}</span>
      <span class="bridge-scope-value">${state.scope.value}</span>
      <button type="button" aria-label="Remove ${state.scope.type==='global'?'global search':'metadata scope'}">×</button>`;
    flow.insertBefore(chip,input);

    chip.querySelector('button').addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      const previous=state.scope;
      state.scope=null;
      clearScopeChip();
      clearLiveMetadataResults();
      setReactInputValue(input,previous.value||'');
      input.focus();
      requestAnimationFrame(()=>syncComposerLayout({keepVisible:true,smooth:true}));
    });
  }

  function chooseMetadataScope(type, value) {
    state.scope = {type, value};
    renderScopeChip();
    setReactInputValue(mainInput(), '');
    removeUnifiedSection();
    renderMetadataSearch(type, value, true);
    mainInput()?.focus();
  }

  function freezeGlobalSearch(value) {
    if (!value) return;
    state.scope = {type:'global', value};
    renderScopeChip();
    setReactInputValue(mainInput(), '');
    removeUnifiedSection();
    renderGlobalSearch(value, true);
    mainInput()?.focus();
  }

  function chooseDateScope(candidate){

    state.scope={

      from:candidate.from,
      to:candidate.to

    renderScopeChip();
    setReactInputValue(mainInput(),'');

    renderDateSearch(state.scope,true);
    mainInput()?.focus();
