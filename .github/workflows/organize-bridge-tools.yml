name: Organize Bridge Tools

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/organize-bridge-tools.yml

permissions:
  contents: write

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization branch
        uses: actions/checkout@v4
        with:
          ref: organize-bridge-tools
          fetch-depth: 0

      - name: Import and organize repositories
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"

          import_repo() {
            local repo="$1"
            local dest="$2"
            echo "Importing $repo -> $dest"
            rm -rf "$TMP/$repo"
            git clone --depth 1 --single-branch --branch main "https://github.com/clementsouchier-stack/$repo.git" "$TMP/$repo"
            rm -rf "$TMP/$repo/.git"
            rm -rf "$ROOT/$dest"
            mkdir -p "$ROOT/$dest"
            cp -a "$TMP/$repo/." "$ROOT/$dest/"
          }

          import_repo "pricing" "bridge-features/pricing/pricing"
          import_repo "pricing-checkout" "bridge-features/pricing/pricing-checkout"
          import_repo "pricing2.1" "bridge-features/pricing/pricing-2-1"
          import_repo "pricing24" "bridge-features/pricing/pricing-24"
          import_repo "pricing245" "bridge-features/pricing/pricing-245"
          import_repo "pricing25" "bridge-features/pricing/pricing-25"
          import_repo "pricing26" "bridge-features/pricing/pricing-26"

          import_repo "paywall-activity" "bridge-features/paywalls/activity"
          import_repo "customtags" "bridge-features/paywalls/custom-tags"
          import_repo "paywall-share" "bridge-features/paywalls/share"
          import_repo "paywall-prelocked" "bridge-features/paywalls/prelocked"
          import_repo "paywall-locked" "bridge-features/paywalls/locked"
          import_repo "paywall-free" "bridge-features/paywalls/free"
          import_repo "paywall-upload-freepro" "bridge-features/paywalls/upload-free-pro"
          import_repo "paywall-upload-propro" "bridge-features/paywalls/upload-pro-pro"
          import_repo "paywall-dropdown" "bridge-features/paywalls/dropdown"
          import_repo "paywall-appearson" "bridge-features/paywalls/appears-on"
          import_repo "banners" "bridge-features/paywalls/banners"
          import_repo "legacyplan_banner" "bridge-features/paywalls/legacy-plan-banner"
          import_repo "replace-af" "bridge-features/paywalls/replace-af"
          import_repo "modale" "bridge-features/paywalls/modale"

          import_repo "analytics" "bridge-features/analytics/v1"
          import_repo "analyticsv2" "bridge-features/analytics/v2"

          import_repo "searchv2" "bridge-features/search/search-v2"
          import_repo "searchv2free" "bridge-features/search/search-v2-free"

          import_repo "sharedpagebanner" "bridge-features/shared-pages/banner"
          import_repo "sharedpagebannernl" "bridge-features/shared-pages/banner-nl"

          import_repo "allmedias" "bridge-features/product-ui/all-medias"
          import_repo "newplayer" "bridge-features/product-ui/new-player"
          import_repo "tabs" "bridge-features/product-ui/tabs"
          import_repo "messages" "bridge-features/product-ui/messages"
          import_repo "csv" "bridge-features/product-ui/csv"
          import_repo "tabs-messages" "bridge-features/product-ui/tabs-messages"
          import_repo "edito" "bridge-features/product-ui/edito"

          import_repo "karim-tiza-site" "not-bridge/karim-tiza/site-v1"
          import_repo "karim-tiza-site-v2" "not-bridge/karim-tiza/site-v2"
          import_repo "karim-tiza-v2" "not-bridge/karim-tiza/v2"
          import_repo "karim-tiza-v3" "not-bridge/karim-tiza/v3"
          import_repo "act-in-synch" "not-bridge/act-in-synch"

          rm -rf "$TMP"

      - name: Commit organized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-features not-bridge
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Organize Bridge prototypes into bridge-tools"
          git push origin HEAD:organize-bridge-tools
