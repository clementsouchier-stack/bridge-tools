name: Bridge Tools CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/music-analyzer]

jobs:
  music-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check --workspace @bridge-tools/music-analyzer

      - name: Build Music Analyzer
        run: npm run build --workspace @bridge-tools/music-analyzer
